<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW Midnight Account Dashboard</title>
<style>
  :root {
    --bg: #121212; --card: #1e1e1e; --card-2: #252525; --line: #2c2c2c; --line-2: #333;
    --text: #e0e0e0; --text-strong: #ffffff; --muted: #888; --muted-2: #aaa;
    --bar: #3987e5;            /* single-series bars: validated on the #1e1e1e card */
    --track: #2e2e2e;
    --dh: #a330c9; --dk: #c41e3a; --druid: #ff7c0a;   /* class accents: identity only, never data */
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
  .container { max-width: 1200px; margin: auto; }
  h1, h2 { color: var(--text-strong); border-bottom: 2px solid var(--line-2); padding-bottom: 8px; }
  h1 { margin: 0 0 6px; }
  h2 { font-size: 1.17em; margin-top: 0; }
  .sub { color: var(--muted-2); font-size: 14px; margin: 0 0 4px; }
  .generated { color: var(--muted); font-size: 13px; margin: 0 0 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .src { padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; border: 1px solid; }
  .src.live { color: #81c784; border-color: #2e7d32; background: rgba(46,125,50,0.15); }
  .src.snap { color: #ffd54f; border-color: #b28704; background: rgba(255,193,7,0.12); }
  .card { background: var(--card); padding: 20px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }

  /* At a glance */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
  .stat-box { background: var(--card); padding: 15px 20px; border-radius: 8px; border-left: 4px solid #1976d2; }
  .stat-box h3 { margin: 0; font-size: 12px; color: var(--muted-2); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .stat-box p { margin: 6px 0 0; font-size: 24px; font-weight: bold; color: var(--text-strong); }
  .stat-box.wide { grid-column: span 2; }
  .stat-box.wide p { font-size: 17px; line-height: 1.35; }

  /* Character cards */
  .chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
  .char { background: var(--card-2); border-radius: 8px; padding: 16px 18px; border-top: 4px solid var(--accent, #555); }
  .char-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .char-name { font-size: 20px; font-weight: 700; color: var(--text-strong); }
  .char-ilvl { font-size: 13px; color: var(--muted-2); white-space: nowrap; }
  .char-ilvl b { font-size: 20px; color: var(--text-strong); }
  .char-meta { color: var(--muted-2); font-size: 13px; margin: 2px 0 12px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tag { background: #2a2a2a; color: #ccc; padding: 2px 8px; border-radius: 4px; font-size: 11px; border: 1px solid #444; }
  .bis { margin: 10px 0; }
  .bis-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .bis-label span:last-child { color: var(--muted-2); }
  .meter { height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .k { color: var(--muted-2); }
  .row .v { text-align: right; }
  .details { margin-top: 12px; }

  /* Item level chart */
  .ilvl-chart { display: flex; flex-direction: column; gap: 10px; }
  .ilvl-row { display: grid; grid-template-columns: 110px 1fr 60px; align-items: center; gap: 12px; font-size: 14px; }
  .ilvl-row .who { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent, #555); flex-shrink: 0; }
  .ilvl-track { height: 18px; position: relative; }
  .ilvl-track > div { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 2px; }
  .ilvl-row .val { text-align: right; color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .hit { cursor: default; }
  .axis-note { color: var(--muted); font-size: 12px; margin-top: 8px; }

  /* Table view */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
  th { background: var(--card-2); color: var(--text-strong); white-space: nowrap; }
  tr:hover td { background: #2a2a2a; }
  .table-wrap { overflow-x: auto; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }

  #tip { position: fixed; pointer-events: none; background: #000; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 6px 9px; font-size: 12px; line-height: 1.4; display: none; z-index: 10; max-width: 260px; }
  .err { color: #ef9a9a; font-size: 13px; }
  @media (max-width: 600px) { .stat-box.wide { grid-column: span 1; } .ilvl-row { grid-template-columns: 90px 1fr 50px; } }

  /* Editing */
  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .lock { background: #2a2a2a; color: #ccc; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .lock.on { color: #81c784; border-color: #2e7d32; background: rgba(46,125,50,0.15); }
  .lock:hover { border-color: #666; }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: #3987e5; cursor: pointer; vertical-align: middle; }
  input[type=checkbox]:disabled { cursor: not-allowed; opacity: .55; }
  select, input[type=text], input[type=number] { background: #2a2a2a; color: var(--text); border: 1px solid #444; border-radius: 5px; padding: 5px 7px; font: inherit; font-size: 13px; }
  select:disabled, input:disabled { opacity: .55; cursor: not-allowed; }
  .spec-pick { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line); }
  .spec-pick .k { color: var(--muted-2); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--line-2); margin-bottom: 14px; padding-bottom: 8px; }
  .card-head h2 { border: 0; margin: 0; padding: 0; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: #2a2a2a; color: #ccc; border: 1px solid #444; border-radius: 14px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .chip.on { background: #1d3b5f; border-color: #3987e5; color: #fff; }
  .todo { display: grid; grid-template-columns: 26px 70px 90px 1fr; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .todo:first-child { border-top: 0; }
  .todo.done .task, .todo.done .note { text-decoration: line-through; color: var(--muted); }
  .pri { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; text-align: center; border: 1px solid; }
  .pri.High { color: #ef9a9a; border-color: #8e3b3b; } .pri.Medium { color: #ffd54f; border-color: #8a6d0b; } .pri.Low { color: #81c784; border-color: #2e7d32; }
  .who-tag { color: var(--muted-2); }
  .task { color: var(--text-strong); }
  .note { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .rep { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .addform { display: grid; grid-template-columns: 1fr 110px 110px 110px 100px auto; gap: 8px; margin-top: 14px; }
  .addform input[type=text] { width: 100%; }
  .btn { background: #1976d2; color: #fff; border: 0; border-radius: 5px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  td.cb, th.cb { text-align: center; }
  td.na { color: #555; text-align: center; }
  .prog { color: var(--muted-2); font-size: 12px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #000; border: 1px solid #444; color: #fff; padding: 9px 16px; border-radius: 6px; font-size: 13px; display: none; z-index: 20; max-width: 90vw; }
  #toast.bad { border-color: #8e3b3b; color: #ef9a9a; }
  @media (max-width: 700px) { .addform { grid-template-columns: 1fr 1fr; } .todo { grid-template-columns: 26px 62px 1fr; } .todo .who-tag { display: none; } }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <div>
      <h1>&#9876;&#65039; WoW Midnight Account Dashboard</h1>
      <p class="sub" id="reset"></p>

    </div>

  </div>

  <div class="card">
    <h2>Bonus rolls</h2>

  <div class="card">
    <h2>Item level</h2>
    <div class="ilvl-chart" id="ilvl"></div>

  <div class="card">
    <h2>All characters (table)</h2>

  </div>
</div>
<div id="tip"></div>
<div id="toast"></div>

};

/* ------------------------------------------------------------------ helpers */
const CLASS_ACCENT = { 'demon hunter': 'var(--dh)', 'death knight': 'var(--dk)', 'druid': 'var(--druid)' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const accentFor = cls => CLASS_ACCENT[String(cls).toLowerCase()] || '#555';
const $ = id => document.getElementById(id);

// Reads the Dashboard tab by its labels, so moved rows or extra columns don't break it.
function fromGrid(grid) {
  const cell = (r, c) => String((grid[r] || [])[c] ?? '').trim();
  const data = { reset: '', characters: [], glance: [] };
  for (let r = 0; r < Math.min(grid.length, 5); r++) if (/^Reset week/i.test(cell(r, 0))) data.reset = cell(r, 0);
  const head = grid.findIndex(row => String((row || [])[0] ?? '').trim() === 'Character');
  if (head >= 0) for (let r = head + 1; r < grid.length && cell(r, 0); r++) data.characters.push(Array.from({ length: 13 }, (_, c) => cell(r, c)));
  const g = grid.findIndex(row => String((row || [])[0] ?? '').trim() === 'At a glance');
  if (g >= 0) for (let r = g + 1; r < grid.length && cell(r, 0); r++) data.glance.push([cell(r, 0), cell(r, 1)]);
  return data;
}

function parseBis(s) {
  const m = String(s).match(/^(.*?):\s*(\d+)\s+of\s+(\d+)/i);
  return m ? { spec: m[1], have: +m[2], total: +m[3] } : null;
}

let toastTimer;
function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = 'none'), bad ? 6000 : 2500);
}

/* ------------------------------------------------------------------ edit key */
const KEY_NAME = 'wowDashboardEditKey';
function getKey() { try { return localStorage.getItem(KEY_NAME) || ''; } catch (e) { return ''; } }
function setKey(k) { try { k ? localStorage.setItem(KEY_NAME, k) : localStorage.removeItem(KEY_NAME); } catch (e) { /* storage blocked: key lasts this visit */ } memKey = k; }
let memKey = getKey();
const canEdit = () => !!(WEBAPP_URL && memKey);

function paintLock() {
  const b = $('lock');
  b.className = 'lock' + (canEdit() ? ' on' : '');
  b.innerHTML = canEdit() ? '&#128275; Editing (click to lock)' : '&#128274; View only';
  b.title = WEBAPP_URL ? '' : 'Editing turns on once WEBAPP_URL is set in this page';
}
$('lock').addEventListener('click', () => {
  if (canEdit()) { setKey(''); paintLock(); renderAll(); return; }
  if (!WEBAPP_URL) { toast('Editing needs the web app URL set in this page first.', true); return; }
  const k = prompt('Enter your edit key (the one set in the hub under WoW > Set web page edit key):');
  if (k && k.trim()) { setKey(k.trim()); paintLock(); renderAll(); toast('Editing on in this browser.'); }
});

/* ------------------------------------------------------------------ writes */
let reloadTimer;
async function send(payload) {
  if (!canEdit()) { toast('Locked: click the lock button and enter your edit key.', true); return false; }
  try {
    // No Content-Type header: sent as text/plain so the browser skips the CORS preflight.
    const res = await fetch(WEBAPP_URL, { method: 'POST', body: JSON.stringify({ ...payload, key: memKey }) });
    const out = await res.json();
    if (!out.ok) {
      if (/edit key/i.test(out.error)) { setKey(''); paintLock(); renderAll(); }
      throw new Error(out.error);
    }
    toast('Saved to the sheet');
    clearTimeout(reloadTimer); reloadTimer = setTimeout(() => load(true), 2500);
    return true;
  } catch (e) {
    toast('Not saved: ' + e.message, true);
    clearTimeout(reloadTimer); reloadTimer = setTimeout(() => load(true), 500);
    return false;
  }
}

/* ------------------------------------------------------------------ tooltip */
const tip = $('tip');
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.innerHTML = t.getAttribute('data-tip');
  tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = (e.clientY + 14) + 'px';
});

/* ------------------------------------------------------------------ render */
let STATE = null, LIVE = false, WHEN = '';
let todoFilter = 'Open';

function renderAll() { if (STATE) render(STATE, LIVE, WHEN); }

function render(state, live, when) {
  STATE = state; LIVE = live; WHEN = when;
  const data = fromGrid(state.dashboard || []);
  const dis = canEdit() ? '' : ' disabled';
  $('reset').textContent = data.reset || '';
  $('src').className = 'src ' + (live ? 'live' : 'snap');
  $('src').textContent = live ? 'Live from Google Sheets' : 'Snapshot';
  $('when').textContent = (live ? 'Loaded ' : 'Taken ') + when;

  // At a glance
  $('glance').innerHTML = data.glance.map(([k, v]) => {
    const wide = isNaN(Number(v)) && v.length > 12;
    return `<div class="stat-box${wide ? ' wide' : ''}"><h3>${esc(k)}</h3><p>${esc(v || '-')}</p></div>`;
  }).join('');

  const specByName = Object.fromEntries((state.specs || []).map(s => [s.name, s]));
  const chars = data.characters.map(r => ({
    name: r[0], realm: r[1], cls: r[2], specs: r[3], content: r[4], ilvl: parseFloat(r[5]), ilvlText: r[5],
    rating: r[6], bis: [r[7], r[8], r[9]].map(parseBis).filter(Boolean), issues: r[10], pulled: r[11], todos: r[12],
  }));

  // Character cards
  $('chars').innerHTML = chars.map(c => {
    const sp = specByName[c.name];
    const pick = sp && sp.options.length > 1
      ? `<div class="spec-pick"><span class="k">Check enchants against</span>
           <select data-spec="${esc(c.name)}"${dis}>${sp.options.map(o => `<option${o === sp.selected ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select></div>`
      : '';
    return `
    <div class="char" style="--accent:${accentFor(c.cls)}">
      <div class="char-head"><span class="char-name">${esc(c.name)}</span><span class="char-ilvl">ilvl <b>${esc(c.ilvlText || '-')}</b></span></div>
      <div class="char-meta">${esc(c.cls)} &middot; ${esc(c.realm)}</div>
      <div class="tags"><span class="tag">${esc(c.specs)}</span><span class="tag">${esc(c.content)}</span><span class="tag">${esc(c.rating)}</span></div>
      ${c.bis.map(b => {
        const pct = b.total ? Math.round(b.have / b.total * 100) : 0;
        return `<div class="bis hit" data-tip="<b>${esc(b.spec)}</b><br>${b.have} of ${b.total} BiS items (${pct}%)">
          <div class="bis-label"><span>${esc(b.spec)} BiS</span><span>${b.have} / ${b.total}</span></div>
          <div class="meter"><div style="width:${pct}%"></div></div></div>`;
      }).join('')}
      <div class="details">
        ${pick}
        <div class="row"><span class="k">Enchants &amp; gems</span><span class="v">${esc(c.issues || '-')}</span></div>
        <div class="row"><span class="k">Open to-dos</span><span class="v">${esc(c.todos || '0')}</span></div>
        <div class="row"><span class="k">Gear pulled</span><span class="v">${esc(c.pulled || '-')}</span></div>
      </div>
    </div>`;
  }).join('');

  // To-Do
  const todos = state.todo || [];
  const counts = { Open: todos.filter(t => !t.done).length, Done: todos.filter(t => t.done).length, All: todos.length };
  $('todo-filters').innerHTML = ['Open', 'Done', 'All'].map(f =>
    `<button type="button" class="chip${f === todoFilter ? ' on' : ''}" data-filter="${f}">${f} (${counts[f]})</button>`).join('');
  const prio = { High: 0, Medium: 1, Low: 2 };
  const shown = todos.filter(t => todoFilter === 'All' || (todoFilter === 'Done') === t.done)
    .sort((a, b) => (a.done - b.done) || ((prio[a.priority] ?? 3) - (prio[b.priority] ?? 3)) || (a.row - b.row));
  $('todo').innerHTML = shown.length ? shown.map(t => `
    <div class="todo${t.done ? ' done' : ''}">
      <input type="checkbox" data-todo="${t.row}"${t.done ? ' checked' : ''}${dis} aria-label="Done">
      <span class="pri ${esc(t.priority)}">${esc(t.priority || '-')}</span>
      <span class="who-tag">${esc(t.character)}</span>
      <div><span class="task">${esc(t.task)}</span>${t.repeats && t.repeats !== 'None' ? `<span class="rep">&#8635; ${esc(t.repeats)}</span>` : ''}
        ${t.notes ? `<div class="note">${esc(t.notes)}</div>` : ''}</div>
    </div>`).join('') : `<p class="prog">Nothing here.</p>`;
  $('addform').style.display = canEdit() ? '' : 'none';

  // Weekly checklist
  const wk = state.weekly || { characters: [], rows: [] };
  const done = wk.characters.map((_, i) => wk.rows.filter(r => r.cells[i] === true).length);
  const total = wk.characters.map((_, i) => wk.rows.filter(r => r.cells[i] !== null).length);
  $('weekly').innerHTML = `<thead><tr><th>Task</th>${wk.characters.map((c, i) => `<th class="cb">${esc(c)}<div class="prog">${done[i]} / ${total[i]}</div></th>`).join('')}</tr></thead><tbody>` +
    wk.rows.map(r => `<tr><td>${esc(r.task)}</td>${r.cells.map((v, i) => v === null ? '<td class="na">-</td>'
      : `<td class="cb"><input type="checkbox" data-wk="${r.row},${i + 2}"${v ? ' checked' : ''}${dis} aria-label="${esc(wk.characters[i])}"></td>`).join('')}</tr>`).join('') + '</tbody>';

  // Bonus rolls
  const bonus = state.bonus || [];
  const totalRolls = bonus.reduce((s, b) => s + (parseInt(b.rolls, 10) || 0), 0);
  $('bonus').innerHTML = `<thead><tr><th>#</th><th>Boss</th><th>Instance</th><th class="cb">Items wanted</th><th>Who wants it</th><th>Plan (who rolls)</th><th class="cb">Rolls this week</th></tr></thead><tbody>` +
    bonus.map(b => `<tr><td>${esc(b.order)}</td><td>${esc(b.boss)}</td><td>${esc(b.instance)}</td><td class="num">${esc(b.wanted)}</td><td>${esc(b.who).replace(/; /g, '<br>')}</td>
      <td><select data-plan="${b.row}"${dis}><option value=""></option>${PLAN_CHARS.map(c => `<option${c === b.plan ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></td>
      <td class="cb"><input type="number" min="0" max="20" step="1" style="width:64px" data-rolls="${b.row}" value="${esc(b.rolls)}"${dis}></td></tr>`).join('') +
    `<tr><td colspan="6"><b>Total rolls planned</b></td><td class="cb"><b>${totalRolls}</b></td></tr></tbody>`;

  // Item level bars (single series, zero baseline)
  const max = Math.max(...chars.map(c => c.ilvl || 0), 1);
  $('ilvl').innerHTML = chars.map(c => `
    <div class="ilvl-row hit" data-tip="<b>${esc(c.name)}</b> (${esc(c.cls)})<br>Item level ${esc(c.ilvlText)}">
      <span class="who" style="--accent:${accentFor(c.cls)}"><span class="dot"></span>${esc(c.name)}</span>
      <div class="ilvl-track"><div style="width:${((c.ilvl || 0) / max * 100).toFixed(1)}%"></div></div>
      <span class="val">${esc(c.ilvlText || '-')}</span>
    </div>`).join('');

  // Table view
  const cols = ['Character', 'Class', 'Specs', 'Content', 'Item level', 'Rating', 'BiS', 'Enchants & gems', 'Open to-dos'];
  $('tbl').innerHTML = `<thead><tr>${cols.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>` +
    chars.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.cls)}</td><td>${esc(c.specs)}</td><td>${esc(c.content)}</td>
      <td class="num">${esc(c.ilvlText)}</td><td>${esc(c.rating)}</td>
      <td>${c.bis.map(b => `${esc(b.spec)} ${b.have}/${b.total}`).join('<br>') || '-'}</td>
      <td>${esc(c.issues)}</td><td class="num">${esc(c.todos)}</td></tr>`).join('') + '</tbody>';
}

/* ------------------------------------------------------------------ events */
document.addEventListener('click', e => {
  const f = e.target.closest('[data-filter]');
  if (f) { todoFilter = f.dataset.filter; renderAll(); }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.todo) {
    const t = STATE.todo.find(x => x.row === +el.dataset.todo);
    if (t) t.done = el.checked;
    send({ action: 'todoDone', row: +el.dataset.todo, value: el.checked });
    renderAll();
  } else if (el.dataset.wk) {
    const [row, col] = el.dataset.wk.split(',').map(Number);
    const r = STATE.weekly.rows.find(x => x.row === row);
    if (r) r.cells[col - 2] = el.checked;
    send({ action: 'checklist', row, col, value: el.checked });
    renderAll();
  } else if (el.dataset.plan || el.dataset.rolls) {
    const row = +(el.dataset.plan || el.dataset.rolls);
    const b = STATE.bonus.find(x => x.row === row);
    if (el.dataset.plan) b.plan = el.value; else b.rolls = el.value;
    send({ action: 'bonus', row, plan: b.plan, rolls: b.rolls });
    renderAll();
  } else if (el.dataset.spec) {
    const s = STATE.specs.find(x => x.name === el.dataset.spec);
    if (s) s.selected = el.value;
    send({ action: 'spec', character: el.dataset.spec, spec: el.value });
  }
});

$('new-char').innerHTML = TODO_CHARS.map(c => `<option>${esc(c)}</option>`).join('');
$('new-cat').innerHTML = TODO_CATEGORIES.map(c => `<option${c === 'Other' ? ' selected' : ''}>${esc(c)}</option>`).join('');
$('addform').addEventListener('submit', async e => {
  e.preventDefault();
  const task = $('new-task').value.trim();
  if (!task) return;
  $('new-add').disabled = true;
  const ok = await send({ action: 'todoAdd', task, priority: $('new-pri').value, character: $('new-char').value, category: $('new-cat').value, repeats: $('new-rep').value });
  $('new-add').disabled = false;
  if (ok) { $('new-task').value = ''; todoFilter = 'Open'; }
});

/* ------------------------------------------------------------------ load */
async function load(fresh) {
  if (!WEBAPP_URL) { render(SNAPSHOT, false, SNAPSHOT.generated); return; }
  // Skip a background refresh while you are typing in a field, so it isn't wiped.
  if (!fresh && document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName)) return;
  try {
    const res = await fetch(WEBAPP_URL + (fresh ? '?fresh=1' : ''), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const state = await res.json();
    render(state, true, new Date().toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }));
  } catch (e) {
    console.warn('Live load failed, showing snapshot:', e);
    if (!STATE || !LIVE) render(SNAPSHOT, false, SNAPSHOT.generated + ' (live data could not be loaded)');
  }
}

paintLock();
load();
setInterval(() => load(false), REFRESH_MINUTES * 60 * 1000);
</script>
